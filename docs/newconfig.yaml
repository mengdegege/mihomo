#---侦听配置---
#mixed-port: 7890
#tun 配置
tun:
  enable: true
  device: utun001
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  strict-route: true
  auto-detect-interface: true

#全局配置
<<: *ipv6
mode: rule
find-process-mode: strict
log-level: debug
unified-delay: true
tcp-concurrent: true
profile:
    store-selected: true
    store-fake-ip: true
global-client-fingerprint: chrome

