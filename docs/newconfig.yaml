# 流媒体
  - RULE-SET,netflix,netflix
  - OR,((RULE-SET,disney),(RULE-SET,hbo),(RULE-SET,hulu)),media
  - PROCESS-NAME,com.google.android.youtube.tv,youtube
# 网络服务
  - RULE-SET,google-cn,DIRECT
