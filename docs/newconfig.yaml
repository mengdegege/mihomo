#---geodata---
geodata-mode: false
geodata-loader: memconservative
#geox-url:
  #geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  #geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  #mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb"
#geo-auto-update: true
#geo-update-interval: 72

#---ntp---用于某些需要时间同步的协议
ntp:
  enable: true
# 是否同步至系统时间，需要 root/管理员权限
  write-to-system: false
  server: time.apple.com
  port: 123
  interval: 60

#---入站配置---
#mixed-port: 7890
#---tun---
tun:
  enable: true
  device: utun001
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  strict-route: true
  auto-detect-interface: true

# --- 域名解析 ---
# hosts
hosts:
  dns.alidns.com: [223.5.5.5]
  dot.pub: [1.12.12.12]
  doh.pub: [1.12.12.12]
  one.one.one.one: [1.0.0.1, 1.1.1.1]
  dns.google: [8.8.8.8, 8.8.4.4]
  route.me: 192.168.88.8
  cn.bing.com: a-0001.a-msedge.net
  +.bing.cn: a-0001.a-msedge.net
  #china.bing123.com: www.bing.com

dns:
  enable: true
  #listen: 127.0.0.1:1053
  <<: *ipv6
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  default-nameserver:
    - 114.114.114.114
  proxy-server-nameserver:
    - 'tls://dot-pure.onedns.net'
    - 'tls://dot.pub'
  direct-nameserver:
    - 'tls://dot-pure.onedns.net'
    - 'tls://dot.pub'
  nameserver:
    - 'tls://dot.onedns.net'
    - 'tls://dot.pub'
    #- 'tls://dns.google#last-stand&ecs=218.107.50.0/23&ecs-override=true'
  nameserver-policy: #不知道有没有用,先写着
    #'rule-set:google-cn': ['tls://dns.google#google&ecs=218.107.50.0/23&ecs-override=true']
    'rule-set:google,riot': ['tls://dns.google#google']
    'rule-set:spotify': ['tls://dns.google#spotify']
    'rule-set:netflix': ['tls://dns.google#netflix']
    'rule-set:disney,hbo,hulu': ['tls://dns.google#media']
    'rule-set:copilot+ip': ['tls://dns.google#bing']
    #'rule-set:microsoft@cn': ['tls://dot.pub', 'tls://dot-pure.onedns.net']
    'rule-set:bing,github,microsoft': ['tls://dns.google#bing']
    #'rule-set:apple-cn': ['tls://dot.pub', 'tls://dot-pure.onedns.net']
    'rule-set:apple': ['tls://dns.google#apple']
    'rule-set:others': ['tls://dns.google#gfw']
    'rule-set:gfw,bahamut': ['tls://dns.google#gfw']
    #'rule-set:cn': ['tls://dot.pub', 'tls://dot-pure.onedns.net']

  #  DNS 增强
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  #fake-ip-filter-mode: blacklist
  fake-ip-filter:
    #- 'rule-set:google-cn'
    - 'rule-set:googlefcm'
    - 'rule-set:dns-ipFilter'

#---代理---
proxies:
  - name: dns-internal
    type: dns

  - name: "http"
    type: http
    server: server
    port: 443
#代理组
proxy-groups:
  - name: last-stand
    <<: *select
    interval: 1800
    timeout: 10000
    proxies:
      - hk-pref
      - sg-pref
      - us-pref
      - tw-pref
      - jp-pref
      - bak
      - free

  - name: youtube
    proxies:
      - REJECT
      - PASS
    <<: *select

  - name: google
    proxies:
      - us-pref
      - sg-pref
      - hk-pref
    <<: *select

  - name: bing
    proxies:
      - hk-pref
      - tw-pref
      - sg-pref
      - last-stand
    <<: *select
    #url: https://www.msftconnecttest.com/connecttest.txt

  - name: media
    proxies:
      - sg-pref
    <<: *select
    #include-all-providers: true
    #filter: "新加坡|Singapore"
    #exclude-filter: "^@pref"

  - name: netflix
    include-all-providers: true
    filter: "(?i)^@pref.*(新加坡|Singapore)"
    <<: *select
    proxies: 
      - media

  - name: spotify
    proxies:
      - hk-pref
      - sg-pref
    <<: *select
   
  - name: apple
    proxies:
      - us-pref
      - DIRECT
    <<: *select
    url: 'https://www.apple.com/library/test/success.html'

  - name: gfw
    proxies:
      - tw-pref
      - jp-pref
      - last-stand
    <<: *fallback

  #- name: sub_dl
  #  proxies:
  #    - DIRECT
  #    - gfw
  #  <<: *select
  #  interval: 7200
  #  url: 'https://sub.xeton.dev'

  - name: res_dl
    proxies:
      - DIRECT
      - gfw
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/master/resouces/direct.txt'
    interval: 7200
    #expected-status: 200/302/400-503
    <<: *fallback

  - name: tv&game
    interval: 0
    proxies:
      - audit
      - PASS
    <<: *select

  - name: streamer
    interval: 0
    proxies:
      - audit
      - PASS
    <<: *select

  - name: audit
    interval: 0
    proxies:
      - PASS
      - REJECT
    <<: *select

  #### 区域筛选 ###
  - name: hk-pref
    proxies:
      - http
    filter: "(?i)^@pref.*(香港|Hong Kong)"
    include-all-providers: true
    <<: *urltest

  - name: us-pref
    proxies:
      - http
    filter: "(?i)^@pref.*(美国|US|United)"
    include-all-providers: true
    <<: *urltest
    
  - name: sg-pref
    proxies:
      - http
    filter: "(?i)^@pref.*(新加坡|Singapore)"
    include-all-providers: true
    <<: *urltest
    
  - name: tw-pref
    filter: "(?i)^@pref.*(台湾|Taiwan)"
    include-all-providers: true
    <<: *lb

  - name: jp-pref
    filter: "(?i)^@pref.*(JP|Japan)"
    include-all-providers: true
    <<: *lb

  - name: free
    hidden: false
    exclude-filter: "(?i)^(@pref |bak )"
    #filter: "(?i)^free.{0,7}CN"
    include-all-providers: true
    <<: *urltest

  - name: "bak"
    hidden: false
    exclude-filter: "(?i)^(@pref |free )"
    include-all-providers: true
    <<: *urltest

